# ---------------------------------------------------------------------------
# EDIT THIS FILE, NOT THE PAGES.
#
# These two links appear everywhere on the site (About page, navbar callout,
# Research page, CV page). Change them here once and every page updates.
#
# Per your advisor: host both on Dropbox so you can replace the file and keep
# the same URL. To get a stable link:
#   1. In Dropbox, right-click the file > Copy link
#   2. Delete the "&st=..." part if present (it expires).
#   3. Set the trailing dl= to suit the file:
#        dl=1  downloads the PDF straight away      (used for the CV)
#        dl=0  opens it in Dropbox's viewer instead (used for the JMP)
#      Every link on this site opens in a new tab, so either way the
#      visitor keeps your page open behind it.
#   4. To update: replace the file in Dropbox *in place* (same filename,
#      overwrite). The link keeps working and serves the new version.
#      Do NOT delete the old file first - that mints a new link and breaks
#      the one on the site.
# ---------------------------------------------------------------------------

