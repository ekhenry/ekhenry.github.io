project:
  type: website
  output-dir: _site
  resources:
    - "CNAME"
    - "assets/**"
    - "papers/**"

website:
  title: "Emma Kate Henry"
  description: "Ph.D. candidate in Economics at the University of Alabama. Semiparametric and nonparametric panel data methods."
  site-url: "https://ekhenry.com"
  favicon: assets/favicon.png
  open-graph: true
  twitter-card: true

  search: false

  navbar:
    logo: ""
    title: "Emma Kate Henry"
    left:
      - href: index.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: cv.qmd
        text: CV
      - href: personal.qmd
        text: Personal

  page-footer:
    left: "&copy; 2026 Emma Kate Henry"
    right: "Built with [Quarto](https://quarto.org)"
    border: false

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    # Open every link in a new tab EXCEPT links to another page of this site.
    # Covers mailto: links, the student-evaluation PDFs, and the Dropbox CV links.
    # In-page anchors (#jmp) stay put.
    include-after-body:
      text: |
        <script>
        document.addEventListener("DOMContentLoaded", function () {
          var host = window.location.hostname;
          document.querySelectorAll("a[href]").forEach(function (a) {
            var raw = a.getAttribute("href");
            if (!raw || raw.charAt(0) === "#") return;
            if (a.hasAttribute("target")) return;
            var url;
            try { url = new URL(a.href, window.location.href); } catch (e) { return; }
            var isInternalPage =
              (url.protocol === "http:" || url.protocol === "https:") &&
              url.hostname === host &&
              (/\.html$/i.test(url.pathname) || /\/$/.test(url.pathname));
            if (isInternalPage) return;
            a.setAttribute("target", "_blank");
            a.setAttribute("rel", "noopener noreferrer");
          });
        });
        </script>
    grid:
      body-width: 1080px
